name: Build Images

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: api-only
            image: hindsight-api
            build_args: |
              INCLUDE_LOCAL_MODELS=false
              PRELOAD_ML_MODELS=false
          - target: cp-only
            image: hindsight-control-plane
            build_args: ""

    steps:
      - uses: actions/checkout@v6

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # v0.8.2 tag     -> 0.8.2 + 0.8 + latest
          # v0.8.2-rc1 tag -> 0.8.2-rc1 (prerelease, no latest, no rolling)
          # v1.0.0 tag     -> 1.0.0 + 1.0 + 1 + latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/standalone/Dockerfile
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete old package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS=$(gh api user/packages/container/${{ matrix.image }}/versions --paginate -q '.[].id')
          TOTAL=$(echo "$VERSIONS" | wc -l | tr -d ' ')
          KEEP=10
          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "Only $TOTAL versions, nothing to clean up"
            exit 0
          fi
          echo "Keeping latest $KEEP of $TOTAL versions"
          echo "$VERSIONS" | tail -n +$((KEEP + 1)) | while read vid; do
            echo "Deleting version $vid"
            gh api -X DELETE user/packages/container/${{ matrix.image }}/versions/$vid || true
          done
